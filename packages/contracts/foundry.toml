[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# Treat warnings as errors so CI catches issues early.
deny = "warnings"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

# Real contracts (IntentRegistry, vaults) arrive in Phase 2. This workspace is
# scaffolding only; see the Development Roadmap.
